name: Deploy Blog to GitHub Pages

on:
  repository_dispatch:
    types: [deploy-blog]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Bot API хранит апдейты только 24 часа, поэтому проверяем ежечасно
    - cron: "0 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Fetch Telegram posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/fetch-telegram.js
      - name: Persist fetched posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json public/telegram
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update posts from Telegram"
            git push
          fi
      - name: Keep scheduled workflow active
        run: |
          KEEPALIVE_FILE=data/.keepalive
          now=$(date -u +%s)
          if [ -f "$KEEPALIVE_FILE" ]; then
            last=$(date -u -d "$(cat "$KEEPALIVE_FILE")" +%s)
          else
            last=0
          fi
          if [ $(( (now - last) / 86400 )) -ge 30 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > "$KEEPALIVE_FILE"
            git add "$KEEPALIVE_FILE"
            git commit -m "chore: keepalive"
            git push
          fi
      - name: Build blog
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
